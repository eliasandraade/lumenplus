# =============================================================================
# Lumen+ Web — nginx servindo o export estatico do Expo
# =============================================================================
# O bundle e 100% estatico (`expo export --platform web`), entao a imagem final
# nao tem Node: so nginx e os arquivos. Nada de secret aqui — o que o bundle
# carrega sao as EXPO_PUBLIC_*, publicas por design.
#
# Os cabecalhos de seguranca vivem em `seguranca.conf` e sao INCLUIDOS em cada
# bloco que precisa deles. Isso nao e estilo: no nginx, um `add_header` dentro
# de um `location` descarta todos os herdados do `server`, sem merge. Sem o
# include repetido, a CSP some justamente na raiz — foi o que aconteceu na
# primeira versao deste arquivo.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressao. `gzip_proxied any` de proposito: o Traefik esta a frente e a
    # resposta passa por ele. Sem isso, nginx recusa comprimir respostas
    # proxiadas e o bundle de 12 MB viaja inteiro (com gzip, ~3,3 MB).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/manifest+json
        image/svg+xml font/woff font/woff2;

    include /etc/nginx/seguranca.conf;

    # ── Service worker ───────────────────────────────────────────────────────
    # NUNCA cachear: um sw.js preso em cache continua servindo a versao antiga
    # do app depois de um deploy, e o usuario fica com um frontend velho sem
    # ter como saber. Precisa vir antes das regras de cache longo.
    location = /sw.js {
        include /etc/nginx/seguranca.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # ── Assets versionados ───────────────────────────────────────────────────
    # O Expo poe hash no nome (entry-<hash>.js). Como o nome muda a cada build,
    # cache longo e imutavel e seguro: nunca serve conteudo velho.
    location /_expo/ {
        include /etc/nginx/seguranca.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /assets/ {
        include /etc/nginx/seguranca.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ── index.html ───────────────────────────────────────────────────────────
    # Sem cache: e o unico arquivo cujo nome nao muda, e e ele que aponta para
    # o bundle novo. Cacheado, o deploy nao chega ao usuario.
    #
    # Um `Cache-Control` so, vindo do add_header. A versao anterior tinha
    # tambem `expires -1`, e as duas diretivas emitiam DOIS cabecalhos
    # Cache-Control na mesma resposta.
    location = /index.html {
        include /etc/nginx/seguranca.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Healthcheck do container. Antes do fallback de SPA, e com `return` para
    # ser um 200 seco sem HTML — o Docker precisa de resposta inequivoca.
    location = /nginx-health {
        access_log off;
        add_header Content-Type "text/plain" always;
        return 200 "ok\n";
    }

    # ── Fallback de SPA ──────────────────────────────────────────────────────
    # O expo-router faz roteamento no cliente: /perfil so existe no JavaScript.
    # Sem este fallback, recarregar a pagina em qualquer rota interna devolve
    # 404 do nginx — o modo de falha classico de SPA servida como arquivo.
    location / {
        include /etc/nginx/seguranca.conf;
        try_files $uri $uri/ /index.html;
    }
}
