# Cabecalhos de seguranca do Lumen+ Web.
#
# ARQUIVO SEPARADO POR NECESSIDADE, nao por organizacao: no nginx, um
# `add_header` dentro de um `location` DESCARTA todos os `add_header` herdados
# do bloco `server`. Nao ha merge. Quem precisa dos cabecalhos tem que
# repeti-los inteiros — e repetir a CSP a mao em cada bloco garante que uma
# copia divirja das outras com o tempo. Este include e a unica copia.
#
# Verificado: antes desta correcao a CSP simplesmente NAO era enviada na raiz,
# porque o bloco `location = /index.html` redefinia os cabecalhos e omitia ela.

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Report-Only, como estava na Vercel: relata violacao e nao bloqueia. O
# connect-src aponta para a API nova; sairam o host da Railway (parado) e
# api.lumenplus.app (nunca resolveu em DNS).
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.lumenplus.andradesystems.com.br https://backend-staging-staging-3d47.up.railway.app https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://*.google.com https://*.gstatic.com https://*.sentry.io https://*.ingest.sentry.io https://*.cloudinary.com; media-src 'self' blob: data: https:; frame-src 'self' https://*.firebaseapp.com https://*.google.com; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
