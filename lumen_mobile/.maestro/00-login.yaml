# Subfluxo de login — pré-requisito dos fluxos de loja.
#
# A conta vem por PARÂMETRO (runFlow env). O fluxo 01 EXCLUI a conta que usa;
# se todos logassem com a principal, ele apagaria a conta e os demais falhariam
# por usuário inexistente.
#
# O ACEITE LEGAL NÃO É NAVEGADO AQUI, e isso é decisão explícita.
# `ci-provision.sh` pré-grava o consentimento via POST /legal/accept para as
# contas que não exercitam esse gate. Quem cobre a tela de verdade é o fluxo
# dedicado `04-aceite-legal.yaml`, com a conta descartável.
#
# Motivo: a tela traz dois documentos completos inline, e ensinar o teste a
# rolar até as checkboxes produziu falha NÃO-DETERMINÍSTICA — o mesmo passo
# passava numa execução e falhava na seguinte. Colocar a conta no estado certo
# antes de começar é mais confiável do que navegar a mesma tela três vezes, e
# não perde cobertura: o gate continua sendo exercitado, uma vez, no 04.
appId: com.lumenchristi.lumenplus
---
- launchApp:
    clearState: true

# Âncora por testID, não pelo texto "E-mail": o rótulo foi removido da tela e
# "E-mail" só existe como placeholder, que não conta como texto visível.
- assertVisible:
    id: "login-email"

- tapOn:
    id: "login-email"
- inputText: ${LOGIN_EMAIL}

- tapOn:
    id: "login-password"
- inputText: ${LOGIN_SENHA}

- hideKeyboard
- tapOn: "Entrar"

# Onboarding de documentos — o app pede CPF e RG logo após o login.
#
# Usamos o próprio botão "Preencher mais tarde" que a tela oferece: é o caminho
# real de quem adia, não exige inventar CPF sintético com dígito válido, e não
# insere documento fictício no banco de staging.
#
# `optional` porque a tela só aparece enquanto o cadastro estiver incompleto.
- extendedWaitUntil:
    visible: "Preencher mais tarde"
    timeout: 40000
    optional: true
- tapOn:
    text: "Preencher mais tarde"
    optional: true

# Espera generosa: o primeiro login faz round-trip ao Firebase e ao backend de
# staging, que pode estar frio. Falhar aqui por impaciência produziria um
# diagnóstico enganoso — pareceria credencial inválida.
- extendedWaitUntil:
    visible: "Início"
    timeout: 45000
