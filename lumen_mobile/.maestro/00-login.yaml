# Subfluxo de login — pré-requisito dos três fluxos de loja.
#
# POR QUE ISTO EXISTE
# Os fluxos 01, 02 e 03 foram escritos assumindo "usuário autenticado" como
# pré-condição declarada em comentário. Na primeira execução real os três
# falharam com "Element not found" — o app abre no login, e nada autenticava.
# Pré-condição que ninguém executa não é pré-condição, é suposição.
#
# A conta vem por PARAMETRO (runFlow env), nao fixa. O fluxo 01 EXCLUI a conta
# que usa — se todos logassem com a principal, 01 rodaria primeiro, apagaria a
# conta, e 02/03 falhariam por falta de usuario. E exatamente para isso que a
# conta descartavel existe.
appId: com.lumenchristi.lumenplus
---
- launchApp:
    clearState: true

# `clearState: true` garante ponto de partida idêntico a cada execução. Sem
# isso, um fluxo anterior deixaria sessão aberta e o próximo pareceria passar
# por motivo errado — ou falharia por estado sujo.
# Âncora por testID, não pelo texto "E-mail".
#
# Depois que removi o rótulo duplicado da tela, "E-mail" passou a existir só
# como placeholder — e placeholder não conta como texto visível para o
# Maestro. A asserção falhava numa tela que estava perfeitamente correta.
# testID não depende de copy nem de como o RN expõe o placeholder.
- assertVisible:
    id: "login-email"

- tapOn:
    id: "login-email"
- inputText: ${LOGIN_EMAIL}

- tapOn:
    id: "login-password"
- inputText: ${LOGIN_SENHA}

- hideKeyboard
- tapOn: "Entrar"

# Espera generosa: o primeiro login faz round-trip ao Firebase e ao backend de
# staging, que pode estar frio. Falhar aqui por impaciência produziria um
# diagnóstico enganoso — pareceria credencial inválida.
# Aceite dos documentos legais — portão de primeiro acesso.
#
# Descoberto pela hierarquia de tela do artefato: depois de autenticar, o app
# exige aceitar Termos de Uso e Política de Privacidade antes de liberar a
# navegação. Não é bug, é requisito de produto (e de LGPD).
#
# CONDICIONAL de propósito: com `clearState: true` a tela aparece toda vez,
# mas se um dia o estado for preservado ela não aparece, e um `tapOn` fixo
# quebraria o fluxo. `when: visible` mantém o subfluxo idempotente.
# Condicional: a conta principal ja aceitou numa execucao anterior e o
# consentimento PERSISTE no backend (user_consents), entao a tela so aparece
# para conta nova. Foi o que derrubou 02 e 03 na ultima rodada.
- runFlow:
    when:
      visible:
        id: "accept-continue"
    commands:
      # DUAS checkboxes, não toques nos títulos.
      #
      # `app/(onboarding)/terms.tsx` gate o botão com
      #   canAccept = termsAccepted && privacyAccepted
      # e os documentos ficam INLINE na tela — por isso tocar no título "Termos
      # de Uso" não fazia nada, e o fluxo ficava parado sem erro aparente.
      #
      # Consentimento granular por documento é exigência do art. 8 da LGPD, não
      # capricho de UI. O teste tem de exercitar os dois separadamente.
      # Âncoras por testID. Tocar pelo texto do rótulo não marcava as
      # checkboxes: a tela tem dois documentos inline, o card de confirmação
      # fica fora da viewport, e o seletor por texto não alcançava de forma
      # confiável. Foi a mesma disciplina que já vale no resto do app — eu é
      # que não a apliquei aqui de primeira.
      - scrollUntilVisible:
          element:
            id: "consent-terms"
          direction: DOWN
          timeout: 20000
      - tapOn:
          id: "consent-terms"
      - tapOn:
          id: "consent-privacy"

      - scrollUntilVisible:
          element:
            id: "accept-continue"
          direction: DOWN
          timeout: 20000
      - tapOn:
          id: "accept-continue"

- extendedWaitUntil:
    visible: "Canais"
    timeout: 45000
