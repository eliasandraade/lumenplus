name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  frontend:
    name: Frontend — TypeScript + Lint + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lumen_mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: lumen_mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build web
        run: npx expo export --platform web
        env:
          # Placeholder seguro — não usa URL de produção no CI
          EXPO_PUBLIC_API_URL: https://backend-staging-staging-3d47.up.railway.app

  backend:
    name: Backend — Pytest + Mypy
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: lumen
          POSTGRES_PASSWORD: lumen_secret
          POSTGRES_DB: lumen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://lumen:lumen_secret@localhost:5432/lumen_test
      REDIS_URL: redis://localhost:6379/0
      AUTH_MODE: DEV
      SECRET_KEY: ci-test-secret-key-not-used-in-prod
      ENVIRONMENT: test
      RATE_LIMIT_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # Toolchain FIXA (ruff/mypy) — antes era `pip install ruff mypy` sem
          # pin, o que deixou o CI vermelho quando o ruff default mudou (0.16.0).
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Run migrations
        run: alembic upgrade head

      - name: Pytest
        run: pytest tests/ -q --tb=short

      - name: Mypy typecheck
        run: mypy app --ignore-missing-imports
        continue-on-error: true
